[package]
name = "safra-poc-tauri"
version = "0.1.0"
edition = "2021"
description = "SAFRA — prova de conceito da casca do desktop em Tauri (não é o aplicativo)"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-single-instance = "=2.5.5"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
