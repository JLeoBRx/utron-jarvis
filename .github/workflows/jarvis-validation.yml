name: JARVIS validation

concurrency:
  group: jarvis-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "claude/adoring-brahmagupta-vcejpt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: ULTRON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyflakes
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python TEST_JARVIS.py
      - name: Static checks
        run: |
          python -m compileall -q ultron tests tools main.py TEST_JARVIS.py
          python -m pyflakes ultron tests tools TEST_JARVIS.py TEST_ULTRON.py main.py
      - name: Build and validate release ZIP
        run: |
          python tools/build_release.py --out ../JARVIS_FINAL.zip
          python tools/build_release.py --check ../JARVIS_FINAL.zip
      - name: Test release ZIP after clean extraction
        run: |
          python -c "import zipfile; zipfile.ZipFile('../JARVIS_FINAL.zip').extractall('../_jarvis_release_test')"
          cd ../_jarvis_release_test/JARVIS
          python TEST_JARVIS.py --quick
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-final-python-${{ matrix.python }}
          path: JARVIS_FINAL.zip
          if-no-files-found: error
          retention-days: 30

  noctario-host:
    name: Noctario host C++ tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ULTRON/firmware/noctario/test/host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile and run host tests
        run: make clean && make && ./test_core

  noctario-esp32-firmware:
    name: Noctario ESP32 firmware compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile firmware for ESP32 DevKit
        working-directory: ULTRON/firmware/noctario
        run: pio run
      - name: Upload ESP32 firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: noctario-esp32-firmware
          path: ULTRON/firmware/noctario/.pio/build/esp32dev/firmware.bin
          if-no-files-found: error
          retention-days: 30

  windows-validation:
    name: Windows installation and test validation
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ULTRON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyflakes
      - name: Run full application test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python TEST_JARVIS.py
      - name: Static checks
        run: |
          python -m compileall -q ultron tests tools main.py TEST_JARVIS.py
          python -m pyflakes ultron tests tools TEST_JARVIS.py TEST_ULTRON.py main.py
      - name: Build and validate Windows release package
        run: |
          python tools/build_release.py --out ../JARVIS_FINAL_WINDOWS.zip
          python tools/build_release.py --check ../JARVIS_FINAL_WINDOWS.zip
      - name: Test Windows release ZIP after clean extraction
        run: |
          python -c "import zipfile; zipfile.ZipFile('../JARVIS_FINAL_WINDOWS.zip').extractall('../_jarvis_release_test_windows')"
          Set-Location ../_jarvis_release_test_windows/JARVIS
          python TEST_JARVIS.py --quick
      - name: Install from the extracted ZIP with INSTALL_JARVIS.bat and run the documented scripts
        # Como um usuário: o ZIP extraído numa pasta nova, INSTALL_JARVIS.bat e os scripts .bat pelo cmd.exe.
        # --unattended: sem perguntas, não baixa modelos e não mexe no início automático. Dados em pasta temporária.
        working-directory: .
        timeout-minutes: 30
        env:
          JARVIS_DATA_DIR: ${{ runner.temp }}\jarvis-dados
          JARVIS_OLLAMA_AUTOSTART: "0"
          JARVIS_NETWORK_DISCOVERY: "0"
          JARVIS_AUTO_BACKUP: "0"
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import zipfile; zipfile.ZipFile('JARVIS_FINAL_WINDOWS.zip').extractall('_jarvis_install_test')"
          Set-Location _jarvis_install_test/JARVIS
          function Invoke-Bat([string]$Line, [int]$Expected = 0, [switch]$AnyCode) {
            # cada comando vai num .cmd próprio: nenhuma aspa passa pelo PowerShell
            Set-Content -Path _passo.cmd -Encoding ascii -Value "@call $Line < NUL 2>&1", "@exit %errorlevel%"
            Write-Host "::group::$Line"
            $out = (& cmd.exe /d /c _passo.cmd) | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            Write-Host "::endgroup::"
            if (-not $AnyCode -and $code -ne $Expected) { Write-Host "::error::$Line terminou com codigo $code (esperado $Expected)"; exit 1 }
            return $out
          }
          function Assert-Text([string]$Text, [string]$Pattern, [string]$What) {
            if ($Text -notmatch $Pattern) { Write-Host "::error::$What (esperado: $Pattern)"; exit 1 }
          }
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $autostartBefore = (Get-ItemProperty -Path $runKey -ErrorAction SilentlyContinue).JARVIS

          $out = Invoke-Bat "INSTALL_JARVIS.bat --unattended"
          Assert-Text $out "Instalacao concluida\. Inicie com START_JARVIS\.bat" "INSTALL_JARVIS.bat nao terminou limpo"
          Assert-Text $out "Skills: \d+/\d+" "o diagnostico do instalador nao rodou"
          if (-not (Test-Path .venv\Scripts\pythonw.exe)) { Write-Host "::error::.venv incompleto"; exit 1 }
          if ((Get-ItemProperty -Path $runKey -ErrorAction SilentlyContinue).JARVIS -ne $autostartBefore) {
            Write-Host "::error::--unattended alterou o inicio automatico"; exit 1
          }

          # instalar de novo não apaga nada: .venv reaproveitado, arquivos do usuário intactos
          Set-Content .venv\marcador-do-usuario.txt "nao apagar"
          New-Item -ItemType Directory -Force assets\stt\modelo-do-usuario | Out-Null
          Set-Content assets\stt\modelo-do-usuario\LEIA.txt "nao apagar"
          $out = Invoke-Bat "INSTALL_JARVIS.bat --unattended"
          Assert-Text $out "existente: reaproveitado" "a segunda instalacao nao reaproveitou o .venv"
          foreach ($file in ".venv\marcador-do-usuario.txt", "assets\stt\modelo-do-usuario\LEIA.txt") {
            if (-not (Test-Path $file)) { Write-Host "::error::a reinstalacao apagou $file"; exit 1 }
          }

          $out = Invoke-Bat "START_JARVIS.bat --version"
          Assert-Text $out "JARVIS \d+\.\d+" "START_JARVIS.bat --version"
          $out = Invoke-Bat "START_JARVIS.bat --status"
          Assert-Text $out "execu" "START_JARVIS.bat --status"
          $out = Invoke-Bat "START_JARVIS.bat --backup"
          Assert-Text $out "Backup criado:" "START_JARVIS.bat --backup"
          $backup = Split-Path -Leaf ((($out -split "Backup criado:")[1].Trim()) -split "`r?`n")[0].Trim()
          $out = Invoke-Bat "START_JARVIS.bat --list-backups"
          Assert-Text $out ([regex]::Escape($backup)) "START_JARVIS.bat --list-backups nao mostrou o backup criado"
          $out = Invoke-Bat 'START_JARVIS.bat --say "que horas sao?" --no-voice --no-perception --no-plugins'
          Assert-Text $out "S\S{1,3}o \d{2}:\d{2}" "START_JARVIS.bat --say"

          # a janela de verdade: START_JARVIS.bat sem argumentos abre pelo pythonw; --stop encerra normalmente
          Set-Content -Path _abrir.cmd -Encoding ascii -Value "@call START_JARVIS.bat < NUL > NUL 2>&1"
          & cmd.exe /d /c _abrir.cmd
          $status = ""
          for ($i = 0; $i -lt 60 -and $status -notmatch "processo \d+"; $i++) {
            Start-Sleep -Seconds 2
            $status = (& .venv\Scripts\python.exe main.py --status) | Out-String
          }
          if ($status -notmatch "processo \d+") {
            Get-ChildItem -Recurse -Filter *.log $env:JARVIS_DATA_DIR | ForEach-Object { Get-Content -Tail 80 $_.FullName }
            Write-Host "::error::START_JARVIS.bat: o JARVIS nao abriu em 120 s"; exit 1
          }
          Write-Host $status
          Start-Sleep -Seconds 10
          $out = Invoke-Bat "START_JARVIS.bat --stop"
          Assert-Text $out "encerrado" "START_JARVIS.bat --stop"
          $out = Invoke-Bat "START_JARVIS.bat --status"
          if ($out -match "processo \d+") { Write-Host "::error::o JARVIS continuou em execucao"; exit 1 }

          $out = Invoke-Bat "DIAGNOSTICO_JARVIS.bat" -AnyCode
          Assert-Text $out "Skills: \d+/\d+" "DIAGNOSTICO_JARVIS.bat"
          $out = Invoke-Bat "ATUALIZAR_JARVIS.bat"
          Assert-Text $out "Atualizacao concluida" "ATUALIZAR_JARVIS.bat"
          Assert-Text $out "Backup criado:" "ATUALIZAR_JARVIS.bat sem o backup antes de atualizar"
          Get-ChildItem -Recurse -Filter *.log $env:JARVIS_DATA_DIR | ForEach-Object { Select-String -Path $_.FullName -Pattern "Traceback" -SimpleMatch -List } | ForEach-Object { Write-Host "::warning::Traceback no log: $($_.Path)" }
          exit 0
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-release-candidate
          path: JARVIS_FINAL_WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
