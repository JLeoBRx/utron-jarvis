{% extends "base.html" %}
{% block main %}
<section class="erro">
  <div class="pagina__interior">
    <p class="erro__codigo">{{ status }}</p>
    <h1>{{ title }}</h1>
    <p>{% if status == 404 %}O endereço que você abriu não existe ou não está mais publicado.{% else %}{{ message }}{% endif %}</p>
    <p><a class="botao botao--principal" href="/">Ir para a página inicial</a></p>
    {% if correlation %}<p class="erro__referencia">Referência: {{ correlation }}</p>{% endif %}
  </div>
</section>
{% endblock %}
