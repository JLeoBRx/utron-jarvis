[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safra"
dynamic = ["version"]
description = "SAFRA — plataforma inteligente integrada (backend: SAFRA Core e SAFRA Portal)"
readme = "README.md"
requires-python = ">=3.11"
# Cada dependência tem a justificativa registrada em docs/decisions/ARCHITECTURE_DECISIONS.md (AD-03, AD-04).
dependencies = [
    "fastapi>=0.115,<1",       # API HTTP e WebSocket com esquema OpenAPI gerado do código
    "uvicorn>=0.30,<1",        # servidor ASGI
    "pydantic>=2.7,<3",        # validação de configuração e de entradas
    "sqlalchemy>=2.0.30,<3",   # acesso a dados portátil (SQLite no Core, PostgreSQL no Portal)
    "alembic>=1.13,<2",        # migrações versionadas, com retorno
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",          # cliente de teste da API
]

[project.scripts]
safra-core = "safra.api.cli:main"

[tool.setuptools.dynamic]
version = { attr = "safra.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safra.storage" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
