; Noctário — ESP32 DevKit (Bluetooth Clássico). Compilar e gravar: pio run -t upload
; Monitor serial (diagnóstico pela USB): pio device monitor -b 115200
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; o Bluetooth Clássico ocupa ~1 MB: partição de aplicação grande (sem OTA, que não é usado; a NVS continua)
board_build.partitions = huge_app.csv
build_flags = -Wall -Wextra
; o teste de host (núcleo sem hardware) fica em test/host e roda no PC com g++
build_src_filter = +<*> -<../test/>
