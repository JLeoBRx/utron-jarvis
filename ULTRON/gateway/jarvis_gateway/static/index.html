<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<meta name="referrer" content="no-referrer">
<title>JARVIS WEB ORB</title>
<link rel="stylesheet" href="/scene/css/tokens.css">
<link rel="stylesheet" href="/static/orb.css">
<script type="importmap">{ "imports": { "three": "/scene/vendor/three/three.module.min.js", "three/addons/": "/scene/vendor/three/addons/" } }</script>
</head>
<body>
<canvas id="stage" aria-label="ORBE do JARVIS — toque para conversar"></canvas>

<header id="top">
  <div id="brand">J.A.R.V.I.S.<small id="brand-sub">WEB ORB</small></div>
  <div id="conn" class="pill" data-kind="pending"><span class="dot"></span><span id="conn-text">CONECTANDO…</span></div>
</header>

<div id="status" aria-live="polite">
  <div id="state-label">—</div>
  <div id="state-detail"></div>
</div>

<div id="auth" class="glass hidden" role="alertdialog" aria-live="assertive">
  <div class="k">AUTORIZAÇÃO PENDENTE</div>
  <div id="auth-text"></div>
  <div class="row" id="auth-buttons">
    <button id="auth-yes" type="button">AUTORIZAR</button>
    <button id="auth-no" type="button" class="ghost">NEGAR</button>
  </div>
  <div id="auth-local" class="dim hidden">Ação sensível: confirme no computador principal.</div>
</div>

<section id="talk" class="glass hidden" aria-label="Conversa com o JARVIS">
  <div id="log" aria-live="polite"></div>
  <form id="say-form" autocomplete="off">
    <input id="say" maxlength="2000" placeholder="Fale com o JARVIS…" aria-label="Mensagem">
    <button id="send" type="submit">ENVIAR</button>
  </form>
  <div class="row">
    <button id="mic" type="button" class="ghost" aria-pressed="false">MICROFONE</button>
    <button id="stop" type="button" class="ghost">INTERROMPER</button>
    <button id="audio" type="button" class="ghost" aria-pressed="true">SOM: LIGADO</button>
    <button id="logout" type="button" class="ghost small">SAIR DESTE DISPOSITIVO</button>
  </div>
</section>

<section id="pair" class="glass hidden" aria-label="Pareamento">
  <div class="k">PAREAR ESTE DISPOSITIVO</div>
  <p class="dim">No computador principal: CONFIGURAÇÕES › REDE REMOTA › PAREAR DISPOSITIVO. Leia o QR Code ou digite o código.
     O pareamento só termina depois de confirmado NO computador.</p>
  <form id="pair-form" autocomplete="off">
    <input id="pair-code" maxlength="12" placeholder="CÓDIGO" aria-label="Código de pareamento" autocapitalize="characters">
    <input id="pair-name" maxlength="40" placeholder="Nome deste dispositivo" aria-label="Nome do dispositivo">
    <button type="submit">PAREAR</button>
  </form>
  <div id="pair-status" class="dim" aria-live="polite"></div>
</section>

<div id="notice" class="hidden" role="status"></div>
<script type="module" src="/static/orb-app.js"></script>
</body>
</html>
